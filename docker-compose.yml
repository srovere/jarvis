# Local Jarvis deployment, started with ./jarvis start. Secrets live in ./secrets (git-ignored); see README.md.
# No jarvis.config.yaml is needed: accounts and preferences are set up in the browser at http://127.0.0.1:3000.
x-jarvis-env: &jarvis-env
  PGPASSWORD_FILE: /run/secrets/pg_password
  JARVIS_DATA_DIR: /data

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_DB: jarvis
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: &worker-build
      context: .
      dockerfile: docker/node.Dockerfile
      args: { APP: worker }
    image: jarvis-worker
    command: ["node", "dist/cli/jarvis.js", "migrate"]
    environment: *jarvis-env
    secrets: [pg_password]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  worker:
    build: *worker-build
    image: jarvis-worker
    restart: unless-stopped
    environment: *jarvis-env
    secrets: [pg_password]
    volumes:
      - jarvis_data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }

  mcp-server:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { APP: mcp-server }
    image: jarvis-mcp-server
    restart: unless-stopped
    environment:
      <<: *jarvis-env
      # Inside the container it must listen on all interfaces; the port published to the host is 127.0.0.1 only.
      JARVIS__MCP__BIND: 0.0.0.0
    # Live Google tools (drafts, focus blocks, tasks) read the uploaded OAuth client and the tokens from /data.
    # Read-write: a token refresh rewrites the token file (atomically, same uid as the worker).
    secrets: [pg_password, mcp_token]
    volumes:
      - jarvis_data:/data
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: jarvis-api
    restart: unless-stopped
    environment:
      <<: *jarvis-env
      JARVIS_MCP_URL: http://mcp-server:3002/mcp
      JARVIS_MCP_TOKEN_FILE: /run/secrets/mcp_token
    secrets: [pg_password, mcp_token]
    volumes:
      - jarvis_data:/data
    # The dashboard and /api; published on the host's loopback only.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{headers:{host:'127.0.0.1:3000'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      mcp-server: { condition: service_healthy }

secrets:
  mcp_token:
    file: ./secrets/mcp_token
  pg_password:
    file: ./secrets/pg_password

volumes:
  pgdata:
  jarvis_data:
