# Despliegue local de Jarvis. Secretos en ./secrets (git-ignorado); ver README.md.
x-jarvis-env: &jarvis-env
  JARVIS_CONFIG: /app/jarvis.config.yaml
  PGPASSWORD_FILE: /run/secrets/pg_password

x-jarvis-config: &jarvis-config
  type: bind
  source: ./jarvis.config.yaml
  target: /app/jarvis.config.yaml
  read_only: true

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_DB: jarvis
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: &worker-build
      context: .
      dockerfile: docker/node.Dockerfile
      args: { APP: worker }
    image: jarvis-worker
    command: ["node", "dist/cli/jarvis.js", "migrate"]
    environment: *jarvis-env
    secrets: [pg_password]
    volumes:
      - *jarvis-config
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  worker:
    build: *worker-build
    image: jarvis-worker
    restart: unless-stopped
    environment: *jarvis-env
    secrets: [pg_password, google_oauth_client]
    volumes:
      - *jarvis-config
      - jarvis_tokens:/data/tokens
    depends_on:
      migrate: { condition: service_completed_successfully }

  mcp-server:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { APP: mcp-server }
    image: jarvis-mcp-server
    restart: unless-stopped
    environment:
      <<: *jarvis-env
      # Dentro del contenedor debe escuchar en todas las interfaces; el publicado al host es sólo 127.0.0.1.
      JARVIS__MCP__BIND: 0.0.0.0
    secrets: [pg_password, mcp_token]
    volumes:
      - *jarvis-config
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

secrets:
  google_oauth_client:
    file: ./secrets/google-oauth-client.json
  mcp_token:
    file: ./secrets/mcp_token
  pg_password:
    file: ./secrets/pg_password

volumes:
  pgdata:
  jarvis_tokens:
