# Copy to jarvis.config.yaml (git-ignored). Every key is optional;
# the values shown are the defaults.
# Any scalar key or simple list can be overridden from the environment with
# JARVIS__SECTION__KEY (case-insensitive), e.g. JARVIS__SYNC__INTERVALMINUTES=10.

# IANA time zone.
timezone: America/Argentina/Buenos_Aires

# Working hours: hours 0..24 (startHour < endHour); ISO days (1 = Monday ... 7 = Sunday).
workSchedule:
  startHour: 9
  endHour: 19
  workDays: [1, 2, 3, 4, 5]

# Focus blocks.
focus:
  titlePrefix: "[Focus] "
  horizonWorkDays: 5 # horizon in work days
  defaultDurationMinutes: 90

# Sync.
sync:
  intervalMinutes: 5
  gmailInitialWindowDays: 90

# Daily briefing.
briefing:
  maxPriorityEmails: 10

# Email.
email:
  maxBodyChars: 4000

# MCP server (publish on 127.0.0.1 only).
mcp:
  bind: 127.0.0.1
  port: 3002
  tokenFile: /run/secrets/mcp_token

# Secrets and data directories.
secretsDir: /run/secrets
dataDir: /data

# Connected accounts. `id` is lowercase (a-z, 0-9, _ and -) and unique.
# `calendars`: ids of calendars that count as busy (default: the primary one).
accounts: []
# accounts:
#   - id: personal
#     provider: google
#     email: person@example.com
#     calendars: [primary]
